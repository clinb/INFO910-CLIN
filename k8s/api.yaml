apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-schema
          image: distributed-task-api:dev
          imagePullPolicy: IfNotPresent
          command: [python, -c, "from app.db import connect; connect().execute('SELECT id FROM tasks LIMIT 0')"]
          envFrom:
            - configMapRef:
                name: dtm-config
            - secretRef:
                name: dtm-db
      containers:
        - name: api
          image: distributed-task-api:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dtm-config
            - secretRef:
                name: dtm-db
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
