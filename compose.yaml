name: dtm-compose

x-app: &app
  image: distributed-task-api:dev
  environment:
    PGHOST: db
    PGDATABASE: tasks
    PGUSER: tasks
    PGPASSWORD: ${POSTGRES_PASSWORD:-tp-local-only}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tp-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tasks -d tasks"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  init-db:
    <<: *app
    command: [python, -m, app.db]
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  api:
    <<: *app
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=6)"]
      interval: 5s
      timeout: 8s
      retries: 12
    restart: unless-stopped

  worker:
    <<: *app
    command: [python, -m, app.worker]
    depends_on:
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
